
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thu thập thông tin người dùng</title>

    <link rel="stylesheet" href="baitap.css">
        
</head>

<body>
    <div class="container">
        <h2>Enter Your Information</h2>

        <form id="userForm">
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                placeholder="Nhập họ và tên"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                placeholder="Nhập địa chỉ email"
                required
            >

            <button type="submit">Submit</button>
        </form>

        <div class="stored-info">
            <h2>Stored Information:</h2>
            <div id="displayInfo">
                <p>Chưa có thông tin được lưu.</p>
            </div>
        </div>
    </div>

    <script src="baitap.js"></script>
        
    </script>
</body>
</html>
