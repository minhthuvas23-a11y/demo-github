<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lật Thẻ (Memory Game)</title>
    <link rel="stylesheet" href="cp1_style.css">
</head>
<body>
    <div class="game-container">
        <h1>Memory Game</h1>
        <div class="score-board">
            Điểm số: <span id="score">0</span>
        </div>
        
        <!-- Khung hiển thị thông báo không gây gián đoạn -->
        <div id="message" class="message-box"></div>

        <!-- Khung grid hiển thị các thẻ bài -->
        <div class="grid" id="grid"></div>
    </div>

    <script src="cp1_script.js"></script>
</body>
</html>
